# CircleCI release pipeline for tecode (Issue: tag-triggered binary release).
#
# Pushing a `v*` tag builds one compiled binary per CircleCI-built target on
# a runner of that target's OWN platform, then attaches them to the GitHub
# Release `bun run tag` (`scripts/tagRelease.ts`) already created as a draft
# and publishes it. This is the ONLY release pipeline for this repo —
# `.github/workflows/release.yml` has been deleted; keeping both would let a
# single tag push race two pipelines to create the same GitHub Release.
#
# ## THIS PIPELINE NEVER CREATES A RELEASE — IT ONLY FINISHES ONE
#
# Pushing a `v*` tag by hand (`git tag v1.2.3 && git push origin v1.2.3`)
# instead of running `bun run tag v1.2.3` on the owner's Mac does NOT
# produce a release. It produces a STUCK pipeline: `publish` (below) looks
# for a draft release matching the tag, finds none (`bun run tag` is the
# only thing that ever creates one), and fails loudly rather than creating
# one itself — a release this pipeline created on its own would permanently
# be missing the macOS binary, since nothing else here builds
# `bun-darwin-arm64`. The only supported way to cut a release is `bun run
# tag <version>` from the project owner's Apple Silicon Mac; see that
# script's own TSDoc (`scripts/tagRelease.ts`) for its full preflight/build/
# release/tag sequence.
#
# ## Why one job per target, and not a build matrix on one machine
#
# `@opentui/core` ships six platform-native optional dependencies
# (`@opentui/core-{darwin,linux,win32}-{x64,arm64}`), each gated by `os`/`cpu`
# in its package.json. `bun install` links only the one matching the HOST, and
# `@opentui/core` resolves its native half through a template-string dynamic
# import that Bun's bundler cannot statically resolve for a foreign platform.
# Cross-compilation therefore fails outright — see `scripts/release.ts`'s
# "Why this machine cannot produce even the four remaining binaries". Each
# target must be built on its own architecture.
#
# ## Only four targets are published — two are gone for good, not deferred
#
# `RELEASE_TARGETS` in `scripts/release.ts` ships exactly these four, split
# by who builds each one (`ReleaseTarget.builtBy`):
#
#   bun-darwin-arm64   builtBy "local"     — the owner's own Apple Silicon
#                                             Mac, via `bun run tag`; NO
#                                             CircleCI job builds this target
#   bun-linux-x64      builtBy "circleci"  — CircleCI-hosted machine executor
#   bun-linux-arm64    builtBy "circleci"  — CircleCI-hosted machine executor, arm.medium
#   bun-windows-x64    builtBy "circleci"  — self-hosted runner, the owner's own Windows x64 box
#
# The owner did not want to install a CircleCI machine runner on their own
# Mac, so `bun-darwin-arm64` is built locally instead of by a
# `build-darwin-arm64` job — there is no such job, and no
# `macos-arm64-self-hosted` executor, in this file. Its binary and checksum
# reach the release by a different path than the other three: `bun run tag`
# uploads them to a draft release BEFORE the tag is pushed, and `publish`
# below finds that draft and adds its own three assets on top of them,
# rather than building all four itself.
#
# `bun-darwin-x64` (Intel macOS) and `bun-windows-arm64` (Windows on Arm) are
# NOT built by anything, anywhere, in this pipeline or by `bun run tag`:
#
#   - CircleCI removed every Intel-macOS resource class in June 2024 — its
#     hosted `macos` executor is Apple silicon only, and the owner has no
#     Intel Mac to self-host one on either.
#   - CircleCI offers no Windows-arm64 resource class at all, hosted or
#     self-hosted, and the owner has no Windows-on-Arm device.
#
# Both were considered and ruled out, not overlooked — see `scripts/
# release.ts`'s TSDoc, "Two targets were dropped, not just left off this
# machine", for the full reasoning. A user on either platform has no binary
# to download and is pointed at the README's "From source" instructions
# (`bun run packages/cli/src/main.ts`) instead.
#
# `PUBLISH_EXPECTED_CI_ASSETS` and `PUBLISH_EXPECTED_RELEASE_ASSETS` below
# list exact file names — the artifacts this workflow's own build jobs must
# produce, and the ones the finished release must carry. They MUST always
# equal, respectively, the `builtBy: "circleci"` subset of `RELEASE_TARGETS`
# and all of it (`scripts/release.test.ts` derives both lists from
# `RELEASE_TARGETS` and fails the build if either drifts from `scripts/
# release.ts`), so if a target is added, dropped, renamed, or moves between
# `"local"`/`"circleci"`, this file and `scripts/release.ts` need updating
# together.
#
# ## Self-hosted runner: register this before the first tag push
#
# `build-windows-x64` targets the resource class `goofmint/windows-x64`.
# That name is written out in full rather than left as a
# `<namespace>/<name>`-style placeholder because `<` and `>` are not legal
# in a resource class name: CircleCI's config compiler rejects the whole
# file ("Invalid format in resource class") before any job runs, so a
# bracketed placeholder does not merely fail to match a runner — it breaks
# the pipeline outright.
#
# It is still a name that DOES NOT EXIST until created. `goofmint` is the
# expected CircleCI namespace (it defaults to the VCS org name); confirm it
# with `circleci namespace` and change it here if yours differs. On the
# in-house Windows x64 box:
#
#   1. `circleci runner resource-class create goofmint/windows-x64 "<description>" --generate-token`
#      — run once, from anywhere with the CircleCI CLI installed and
#      authenticated. This prints a runner AUTH TOKEN — copy it, it is
#      shown only once.
#   2. Install "machine runner 3" on that physical machine (CircleCI's
#      installer for Windows), configuring it with the resource class name
#      and auth token from step 1. The runner then polls CircleCI for jobs
#      targeting that resource class and executes them locally.
#
# Until step 1 runs, `build-windows-x64` stays queued with no runner to
# claim it, and `publish` — which `requires` all three CircleCI build jobs
# — never starts. Nothing is published from a half-registered setup. There
# is no equivalent step for macOS: `bun run tag` runs directly on the
# owner's Mac, outside CircleCI entirely, so no runner is ever registered
# for it.
#
# ## Required project configuration
#
# - `TECODE_RELEASE_TOKEN` — an environment variable in CircleCI project
#   settings, holding a GitHub token this `publish` job uses for its own
#   REST API calls (list releases, upload assets, PATCH draft:false).
#   Deliberately NOT named `GITHUB_TOKEN`: that name is common enough
#   ambient tooling convention that something else could already be
#   supplying it with broader scope than this job needs, and this name
#   guarantees the value present is only ever here because someone set it
#   FOR this job. Unlike GitHub Actions there is no ambient `github.token`
#   on CircleCI; nothing here can publish without this variable set.
#
#   Minimum scope: a FINE-GRAINED personal access token, "Repository
#   access" limited to only `goofmint/tecode`, with exactly one repository
#   permission — Contents: Read and write (GitHub files releases under
#   Contents; this is what lets `publish` upload assets and flip
#   draft:false). Do NOT use a classic PAT here — its `repo` scope reaches
#   every repository the token's owner can access, plus issues, with no way
#   to narrow it to just this one repository's releases. This token is used
#   ONLY for the GitHub REST API calls in this job; CircleCI's own
#   `checkout` step uses its own separate credentials for `git`, unrelated
#   to this token.
#
#   `bun run tag` needs its OWN `TECODE_RELEASE_TOKEN` set in the
#   environment it runs in (the owner's Mac) — see `scripts/tagRelease.ts`'s
#   `checkReleaseTokenSet` for that copy's own scope requirement (identical:
#   fine-grained, `goofmint/tecode` only, Contents: Read and write). The two
#   are separate credentials in separate places, never shared — rotate or
#   revoke either independently of the other. Neither copy of this token
#   needs any git push access: pushing the release tag itself goes through
#   ordinary `git` credentials on whichever machine runs `bun run tag`, not
#   through this token.
# - The self-hosted Windows runner's auth token from step 1 above,
#   configured on that machine's runner install — not stored in this repo.

version: 2.1

executors:
  linux-x64:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
  linux-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
  # SELF-HOSTED — the owner's own in-house Windows x64 machine, not a
  # CircleCI-hosted image. `goofmint/windows-x64` does not exist until it is
  # registered (this file's top-of-file comment, "Self-hosted runner:
  # register this before the first tag push"); create it once, from
  # anywhere with the CircleCI CLI authenticated against this project:
  #
  #   circleci runner resource-class create goofmint/windows-x64 \
  #     "tecode release: owner's Windows x64 box" --generate-token
  #
  # then install machine runner 3 on that Windows machine with the resulting
  # resource class name and auth token. `shell: bash.exe` matches this
  # config's own `build-windows-x64` job, which writes POSIX-shell `run`
  # steps (`set -euo pipefail`, `export PATH=...`) throughout except where a
  # step explicitly opts into `shell: powershell.exe` — a self-hosted runner
  # needs Git for Windows (or another `bash.exe` provider) on PATH for this
  # default to resolve.
  windows-x64-self-hosted:
    machine: true
    resource_class: goofmint/windows-x64
    shell: bash.exe

commands:
  install-bun-posix:
    description: Install Bun on Linux/macOS and put it on PATH for later steps.
    steps:
      - run:
          name: Install Bun
          command: |
            set -euo pipefail
            curl -fsSL https://bun.sh/install | bash
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Report the Bun and host architecture actually in use
          command: |
            set -euo pipefail
            bun --version
            uname -m

  build-and-persist:
    description: >-
      Build one target with the repo's own release script, then hand the
      binary and its checksum to the workspace for the publish job.
    parameters:
      target:
        type: string
    steps:
      - run:
          name: Install dependencies
          # --frozen-lockfile so a runner can never silently resolve a
          # different dependency tree than the one committed. bun.lock records
          # all six @opentui/core platform packages, so this succeeds on every
          # platform even though only one of them links here.
          command: bun install --frozen-lockfile
      - run:
          name: Build << parameters.target >>
          # release.ts enforces the size limit and writes the .sha256 itself.
          command: bun run release << parameters.target >>
      - persist_to_workspace:
          root: .
          paths:
            - dist

jobs:
  build-linux-x64:
    executor: linux-x64
    steps:
      - checkout
      - install-bun-posix
      - build-and-persist:
          target: bun-linux-x64

  build-linux-arm64:
    executor: linux-arm64
    steps:
      - checkout
      - install-bun-posix
      - build-and-persist:
          target: bun-linux-arm64

  build-windows-x64:
    executor: windows-x64-self-hosted
    steps:
      - checkout
      - run:
          name: Install Bun
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"
            irm bun.sh/install.ps1 | iex
      - run:
          name: Build bun-windows-x64
          # The Bun installer puts bun.exe under %USERPROFILE%\.bun\bin, which
          # is not on PATH in this shell yet.
          command: |
            set -euo pipefail
            export PATH="$(cygpath -u "$USERPROFILE")/.bun/bin:$PATH"
            bun --version
            bun install --frozen-lockfile
            bun run release bun-windows-x64
      - persist_to_workspace:
          root: .
          paths:
            - dist

  publish:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Refuse to publish unless every CircleCI-built artifact is present
          # This checks only THIS WORKFLOW's own three build jobs' output in
          # the shared workspace — bun-darwin-arm64 (builtBy "local" in
          # scripts/release.ts's RELEASE_TARGETS) is never in here, because
          # no CircleCI job builds it; it already reached the draft release
          # directly, via `bun run tag`, before this workflow even started.
          #
          # MUST always equal the number of `builtBy: "circleci"` entries in
          # `RELEASE_TARGETS` (`scripts/release.ts`, currently 3) —
          # `scripts/release.test.ts` parses this exact YAML value and
          # asserts that equality, precisely so the two numbers cannot
          # silently drift apart. Change this the same commit you change
          # RELEASE_TARGETS or its builtBy split, or that test fails.
          environment:
            # The exact file names build-linux-x64, build-linux-arm64 and
            # build-windows-x64 must have left in the shared workspace —
            # NOT a count. A count of 3 is satisfied by three files with
            # the wrong names, which is precisely the shape a rename or a
            # half-migrated target set produces, so match the set instead.
            PUBLISH_EXPECTED_CI_ASSETS: >-
              tecode-linux-x64
              tecode-linux-x64.sha256
              tecode-linux-arm64
              tecode-linux-arm64.sha256
              tecode-windows-x64.exe
              tecode-windows-x64.exe.sha256
          command: |
            set -euo pipefail
            ls -la dist/
            found=$(find dist -maxdepth 1 -type f -name 'tecode-*' -exec basename {} \; | sort)
            expected=$(printf '%s\n' $PUBLISH_EXPECTED_CI_ASSETS | sort)
            missing=$(comm -13 <(printf '%s\n' "$found") <(printf '%s\n' "$expected") | tr '\n' ' ')
            unexpected=$(comm -23 <(printf '%s\n' "$found") <(printf '%s\n' "$expected") | tr '\n' ' ')
            if [ -n "${missing// /}" ] || [ -n "${unexpected// /}" ]; then
              echo "release: refusing to publish — this workflow's own build jobs did not produce exactly the expected artifacts" >&2
              [ -n "${missing// /}" ] && echo "release:   missing:    $missing" >&2
              [ -n "${unexpected// /}" ] && echo "release:   unexpected: $unexpected" >&2
              exit 1
            fi
            echo "release: all 6 expected CircleCI-built artifacts present"
      - run:
          name: Find the bun run tag draft release, attach this workflow's assets, and publish
          # CIRCLE_TAG is passed through the environment rather than
          # interpolated into the script: it is attacker-influenceable by
          # anyone who can push a tag, and `v$(id)` is a valid Git ref name,
          # so a directly-substituted tag would be executed by the shell under
          # a token that can write repository contents.
          #
          # Every asset the FINISHED release must carry: one binary and
          # one checksum per RELEASE_TARGETS entry, the `bun run tag`
          # macOS pair included. Distinct from PUBLISH_EXPECTED_CI_ASSETS
          # above, which is only what THIS workflow's build jobs produce.
          #
          # Names, not a count, for the reason above and one more specific
          # to this check: the release already holds assets uploaded by a
          # different machine at a different time (`bun run tag`), so "4
          # binaries are present" does not establish that the macOS one is
          # among them — a stray or misnamed asset makes the arithmetic
          # work out while the platform a user came for is still missing.
          # scripts/release.test.ts pins this list against RELEASE_TARGETS.
          environment:
            PUBLISH_EXPECTED_RELEASE_ASSETS: >-
              tecode-darwin-arm64
              tecode-darwin-arm64.sha256
              tecode-linux-x64
              tecode-linux-x64.sha256
              tecode-linux-arm64
              tecode-linux-arm64.sha256
              tecode-windows-x64.exe
              tecode-windows-x64.exe.sha256
          command: |
            set -euo pipefail

            : "${TECODE_RELEASE_TOKEN:?set TECODE_RELEASE_TOKEN in CircleCI project settings (a fine-grained PAT scoped to only goofmint/tecode, Contents: Read and write)}"
            : "${CIRCLE_TAG:?this job only runs for tag pushes}"

            api="https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"

            # GET /releases/tags/{tag} does NOT reliably return draft
            # releases (confirmed against the GitHub REST API) — list and
            # match on tag_name + draft ourselves instead. This mirrors
            # scripts/tagRelease.ts's own findDraftReleaseByTag, the same
            # selection algorithm, unit-tested there; bash has no import
            # statement, so this shell implementation is verified instead by
            # actually executing it against a stubbed curl (see this
            # change's own validation notes).
            # One page suffices: the API lists releases newest-first and
            # `bun run tag` creates this draft seconds before pushing the
            # tag that started this job, so it is effectively always the
            # newest release. 100 leaves room for a pathological backlog
            # without paginating.
            releases=$(curl -fsSL "$api/releases?per_page=100" \
              -H "Authorization: Bearer $TECODE_RELEASE_TOKEN" \
              -H "Accept: application/vnd.github+json")

            release_id=$(printf '%s' "$releases" | TAG="$CIRCLE_TAG" python3 -c '
            import json, os, sys
            releases = json.loads(sys.stdin.read())
            tag = os.environ["TAG"]
            for r in releases:
                if r.get("tag_name") == tag and r.get("draft") is True:
                    print(r["id"])
                    sys.exit(0)
            sys.exit(1)
            ') || {
              echo "release: no draft release found for tag $CIRCLE_TAG" >&2
              echo "release: this tag was pushed WITHOUT running 'bun run tag' on the owner's Apple Silicon Mac first — that command builds bun-darwin-arm64 and creates the draft release BEFORE pushing the tag, and this pipeline never creates one itself (it would permanently omit the macOS binary). The macOS binary will never arrive this way. Delete this tag on GitHub, then run 'bun run tag ${CIRCLE_TAG#v}' (or 'bun run tag $CIRCLE_TAG') from that Mac — it will push the tag itself once it succeeds." >&2
              exit 1
            }
            echo "release: found draft release id $release_id for tag $CIRCLE_TAG"

            release=$(curl -fsSL "$api/releases/$release_id" \
              -H "Authorization: Bearer $TECODE_RELEASE_TOKEN" \
              -H "Accept: application/vnd.github+json")
            upload_url=$(printf '%s' "$release" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')

            for asset in dist/tecode-*; do
              name=$(basename "$asset")
              echo "release: uploading $name"
              # `set -e` plus curl's `-f` means a failed upload aborts the
              # step here, before the completeness check and PATCH below —
              # the draft stays a draft, which is the intended failure mode.
              curl -fsSL -X POST "$upload_url?name=$name" \
                -H "Authorization: Bearer $TECODE_RELEASE_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$asset" > /dev/null
            done

            # Re-fetch to see the assets bun run tag AND this job both
            # uploaded, and confirm the release now holds all four binaries
            # and all four checksums before flipping it public — a partial
            # release must never go live silently missing a platform.
            release=$(curl -fsSL "$api/releases/$release_id" \
              -H "Authorization: Bearer $TECODE_RELEASE_TOKEN" \
              -H "Accept: application/vnd.github+json")
            attached=$(printf '%s' "$release" | python3 -c 'import json,sys; print("\n".join(a["name"] for a in json.load(sys.stdin)["assets"]))' | sort)
            expected=$(printf '%s\n' $PUBLISH_EXPECTED_RELEASE_ASSETS | sort)
            echo "release: release holds: $(printf '%s' "$attached" | tr '\n' ' ')"
            missing=$(comm -13 <(printf '%s\n' "$attached") <(printf '%s\n' "$expected") | tr '\n' ' ')
            unexpected=$(comm -23 <(printf '%s\n' "$attached") <(printf '%s\n' "$expected") | tr '\n' ' ')
            if [ -n "${missing// /}" ] || [ -n "${unexpected// /}" ]; then
              echo "release: refusing to publish — the release does not hold exactly the expected assets" >&2
              [ -n "${missing// /}" ] && echo "release:   missing:    $missing" >&2
              [ -n "${unexpected// /}" ] && echo "release:   unexpected: $unexpected" >&2
              exit 1
            fi

            curl -fsSL -X PATCH "$api/releases/$release_id" \
              -H "Authorization: Bearer $TECODE_RELEASE_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d '{"draft":false}' > /dev/null

            echo "release: published $CIRCLE_TAG"

workflows:
  release:
    # Every job needs BOTH filters. CircleCI ignores tag pushes unless a job
    # opts in with `tags`, and without `branches: ignore` the same jobs would
    # also run on every ordinary branch push. Omitting either on ANY job —
    # including `publish` — silently breaks the pipeline: a job without them
    # never runs for the tag, and the whole workflow is then skipped.
    jobs:
      - build-linux-x64:
          filters: &release-tags
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-linux-arm64:
          filters: *release-tags
      - build-windows-x64:
          filters: *release-tags
      - publish:
          filters: *release-tags
          requires:
            - build-linux-x64
            - build-linux-arm64
            - build-windows-x64
