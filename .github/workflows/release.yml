name: Release

# Issue #36 "4.5 CI pipeline" gate 6 (Req 8.5, 13.2; design.md §17): the
# tag-triggered six-target compiled-binary matrix, driving `scripts/
# release.ts` (Issue #35) rather than reimplementing any of its logic —
# the matrix, `binaryFileName`, the size assertion, and the target-name
# filter (`bun run release <target>`) all already live there; read that
# file's TSDoc before changing anything here.
#
# ## Why six runners, not three
#
# It is tempting to "simplify" this to three OS-only runners
# (ubuntu-latest/macos-latest/windows-latest) and pass `--target=` twice
# per runner for the two arches. THAT DOES NOT WORK, and the failure mode
# if someone tries it is actively misleading: `@opentui/core` ships six
# platform-*and-arch*-specific optional dependencies
# (`@opentui/core-{darwin,linux,win32}-{x64,arm64}`, one per target, each
# gated by `os`/`cpu` package.json fields), and `bun install` links only
# the ONE matching the runner it's actually running on. `@opentui/core`'s
# own runtime resolves its native half with a template-string dynamic
# import (`import(\`@opentui/core-${process.platform}-${process.arch}/
# index.ts\`)`) that Bun's bundler can only ever resolve for the HOST's own
# linked package — so `ubuntu-latest` (x64) can build `bun-linux-x64` but
# NOT `bun-linux-arm64`, `macos-latest` (arm64) can build
# `bun-darwin-arm64` but NOT `bun-darwin-x64`, and so on for Windows. The
# resulting error (`Could not resolve: "@opentui/core-<platform>-<arch>/
# index.ts"`) reads like a missing dependency, not an architecture
# mismatch — `scripts/release.ts`'s own `classifyBuildFailure` recognizes
# this exact signature and labels it a known limitation for exactly this
# reason (see that script's top-of-file TSDoc, "Why this machine cannot
# produce all six binaries").
#
# The fix is one runner per target, matched on BOTH os and arch, which is
# what the matrix below does. This repo is public, so GitHub's free arm64
# hosted runners (`ubuntu-24.04-arm`, `windows-11-arm`) and the free
# Intel/Apple-Silicon macOS runners (`macos-15-intel`/`macos-latest`) are all
# available with no billing implications:
#
# | target            | runner            |
# |-------------------|--------------------|
# | bun-linux-x64     | ubuntu-latest      |
# | bun-linux-arm64   | ubuntu-24.04-arm   |
# | bun-darwin-x64    | macos-15-intel     |
# | bun-darwin-arm64  | macos-latest       |
# | bun-windows-x64   | windows-latest     |
# | bun-windows-arm64 | windows-11-arm     |
#
# darwin/x64 needs its own pinned label because macos-14 and later —
# including `macos-latest` — run on Apple Silicon/arm64. `macos-15-intel`
# is the label to use: the older `macos-13` image was RETIRED on
# 2025-12-04, so pinning it makes this matrix leg unschedulable and
# silently drops the darwin/x64 binary and its size report. Note
# `macos-15-intel` is GitHub's LAST x86_64 Actions image and is announced
# only through August 2027; when it goes, `bun-darwin-x64` has no hosted
# runner left and will need a self-hosted one (or dropping). Re-verify all six labels against GitHub's current hosted-runner
# docs before ever changing this table; runner labels get renamed/retired,
# and a stale one fails the whole matrix job with an opaque "no runner
# matching the specified labels" error that looks nothing like the
# `@opentui/core` failure above.

on:
  push:
    tags:
      - "v*"

# Read-only at the WORKFLOW level, deliberately (narrowed in Issue #36's
# PR #76): `build` and `summary` only build binaries and upload them as
# Actions artifacts, which `actions/upload-artifact` does through the
# Actions API rather than the contents scope — a write-scoped
# `GITHUB_TOKEN` on either job would be reachable by any compromised
# dependency action for no benefit. `publish` below (Issue #38 "5.2 User
# documentation and release") is the one job that actually creates the
# GitHub Release — it scopes `contents: write` to ITSELF, in its own `jobs.
# publish.permissions` block, exactly as this comment previously said a
# future publishing step should. Do not move that grant back up here: the
# workflow-level default must stay `read` so `build`/`summary` keep the
# narrowest token they can.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target.bunTarget }} on ${{ matrix.target.runner }})
    strategy:
      # One target's failure (a real regression, or a runner-label going
      # stale) must never hide the other five targets' results — every
      # target's own outcome is what the summary job below reports on.
      fail-fast: false
      matrix:
        target:
          - { bunTarget: bun-linux-x64, runner: ubuntu-latest }
          - { bunTarget: bun-linux-arm64, runner: ubuntu-24.04-arm }
          - { bunTarget: bun-darwin-x64, runner: macos-15-intel }
          - { bunTarget: bun-darwin-arm64, runner: macos-latest }
          - { bunTarget: bun-windows-x64, runner: windows-latest }
          - { bunTarget: bun-windows-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `--frozen-lockfile`, same as every CI job: a RELEASE artifact must
      # be built from the locked dependency set, and a stale lockfile
      # should fail the build loudly rather than silently resolving to
      # something else. `bun.lock` already records all six
      # `@opentui/core-<platform>-<arch>` optional dependencies, so the
      # frozen install still links THIS runner's own native one — which is
      # the entire reason the matrix is split by runner in the first place
      # (this file's own top-of-file comment).
      - run: bun install --frozen-lockfile
      # `scripts/release.ts`'s own target-name filter (its TSDoc's
      # "Usage") — builds ONLY this runner's target, so a runner never
      # attempts (and fails on) one of the other five. This single
      # invocation also writes `dist/<binaryFileName>.sha256` (Issue #38
      # "5.2 User documentation and release", `scripts/release.ts`'s
      # `writeChecksumFile`, wired into this script's own `main()` right
      # after a successful, in-budget build) — there is no separate
      # checksum step here on purpose, so the checksum can never drift from
      # what this exact build step produced.
      - name: Build ${{ matrix.target.bunTarget }}
        run: bun run release ${{ matrix.target.bunTarget }}
      - name: Record size for the summary job
        shell: bash
        run: |
          mkdir -p size-report
          # Excludes the `.sha256` sibling explicitly — relying on `ls`'s
          # lexical sort (a prefix always sorts before anything that
          # extends it, so the real binary would win `head -n1` anyway) is
          # correct today but fragile to read; this is unambiguous.
          BIN=$(ls dist/tecode-* 2>/dev/null | grep -v '\.sha256$' | head -n1)
          if [ -z "$BIN" ]; then
            echo "release: no binary found in dist/ for ${{ matrix.target.bunTarget }}" >&2
            exit 1
          fi
          SIZE_BYTES=$(wc -c < "$BIN" | tr -d ' ')
          echo "{\"target\":\"${{ matrix.target.bunTarget }}\",\"file\":\"$(basename "$BIN")\",\"sizeBytes\":$SIZE_BYTES}" > "size-report/${{ matrix.target.bunTarget }}.json"
      - uses: actions/upload-artifact@v4
        with:
          # Unique per target so all six land as distinct release assets,
          # never overwriting each other (`actions/upload-artifact` would
          # silently collide on a shared name across matrix jobs). The
          # `.sha256` sibling is excluded here (its own `checksum-*`
          # artifact below) so `publish`'s later binary/checksum download
          # passes stay simple, unambiguous globs rather than needing to
          # filter one out of the other.
          name: tecode-${{ matrix.target.bunTarget }}
          path: |
            dist/tecode-*
            !dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: size-report-${{ matrix.target.bunTarget }}
          path: size-report/${{ matrix.target.bunTarget }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          # Issue #38 "5.2 User documentation and release": the SHA-256
          # checksum `bun run release`'s own `writeChecksumFile` wrote
          # alongside this target's binary — `publish` downloads every
          # `checksum-*` artifact and attaches each `.sha256` file to the
          # Release next to the binary it describes.
          name: checksum-${{ matrix.target.bunTarget }}
          path: dist/*.sha256
          if-no-files-found: error

  summary:
    name: Release summary
    needs: build
    # Runs even when one or more matrix legs failed (`fail-fast: false`
    # above) — the summary table is exactly where a partial-failure release
    # run should be diagnosed from, not skipped.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: size-report-*
          path: size-reports
          merge-multiple: true
      - name: Write target x size table to the job summary
        shell: bash
        run: |
          {
            echo "## Release matrix — target sizes"
            echo ""
            echo "| Target | Binary | Size | Limit | Status |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          LIMIT_BYTES=120000000
          shopt -s nullglob
          for f in size-reports/*.json; do
            TARGET=$(jq -r '.target' "$f")
            FILE=$(jq -r '.file' "$f")
            SIZE=$(jq -r '.sizeBytes' "$f")
            SIZE_MB=$(awk "BEGIN { printf \"%.2f\", $SIZE / 1000000 }")
            LIMIT_MB=$(awk "BEGIN { printf \"%.2f\", $LIMIT_BYTES / 1000000 }")
            if [ "$SIZE" -le "$LIMIT_BYTES" ]; then
              STATUS="ok"
            else
              STATUS="OVER LIMIT"
            fi
            echo "| $TARGET | $FILE | ${SIZE_MB} MB | ${LIMIT_MB} MB | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
          done

          MISSING=$((6 - $(ls size-reports/*.json 2>/dev/null | wc -l)))
          if [ "$MISSING" -gt 0 ]; then
            {
              echo ""
              echo "**$MISSING of 6 targets did not report a size** — see the \`build\` job's per-target logs (a failed or skipped matrix leg never uploads its size-report artifact)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Issue #38 "5.2 User documentation and release": publish the actual
  # GitHub Release once every matrix leg has succeeded. `needs: build` with
  # no `if: always()` (unlike `summary` above) is the gate that matters
  # here — GitHub Actions runs a job that `needs` a matrix job only when
  # EVERY instance of that matrix succeeded, so a single failed/skipped
  # target (a real regression, or one of the six runner labels going stale
  # — this file's own top-of-file comment) silently skips `publish`
  # entirely rather than shipping a Release with fewer than six binaries.
  # `summary` is deliberately NOT a dependency here: it is purely
  # informational (`if: always()`, and can run — and even fail on its own
  # unrelated grounds — independently of whether every real binary
  # actually built), and gating `publish` on it too would let a `summary`-
  # job-only hiccup block a release whose six binaries are otherwise fine.
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # The ONE job in this workflow that writes repository contents (this
    # file's own top-of-file `permissions:` comment) — scoped here, to
    # exactly this job, rather than at the workflow level, so the
    # `build`/`summary` jobs' tokens stay read-only no matter what.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download every target's binary
        uses: actions/download-artifact@v4
        with:
          pattern: tecode-bun-*
          path: release-assets
          merge-multiple: true
      - name: Download every target's checksum
        uses: actions/download-artifact@v4
        with:
          pattern: checksum-*
          path: release-assets
          merge-multiple: true
      - name: Confirm all 6 binaries and all 6 checksums are present before publishing anything
        shell: bash
        run: |
          BIN_COUNT=$(ls release-assets/tecode-* 2>/dev/null | grep -v '\.sha256$' | wc -l)
          SHA_COUNT=$(ls release-assets/*.sha256 2>/dev/null | wc -l)
          echo "release: found $BIN_COUNT binaries and $SHA_COUNT checksums in release-assets/"
          ls -la release-assets/
          if [ "$BIN_COUNT" -ne 6 ] || [ "$SHA_COUNT" -ne 6 ]; then
            echo "release: refusing to publish — expected 6 binaries and 6 checksums, got $BIN_COUNT and $SHA_COUNT" >&2
            exit 1
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "tecode ${{ github.ref_name }}" \
            --notes-file docs/release-notes-template.md \
            release-assets/*
